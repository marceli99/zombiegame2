# `signaling/` is the tiny WebSocket server that brokers WebRTC connections
# between browsers (and serves `web/`).  It shares this lock file but is built
# separately (`cargo run -p signaling`); the game's own targets never link it.
[workspace]
members = ["signaling"]

[package]
name = "zombiegame2"
version = "0.1.0"
edition = "2021"

# The game is a library crate; `src/main.rs` is a thin entry point that
# `build-web.sh` compiles to wasm (and that runs natively for single player
# and the unit tests).

[dependencies]
# Trimmed feature set: everything the game touches (2D sprites, UI/text, states,
# procedural `Pitch` audio, gamepads, bloom + TonyMcMapface tonemapping which
# needs the `tonemapping_luts`/`ktx2`/`zstd` trio) and nothing it doesn't —
# drops gltf/pbr/scene/animation/gizmos and the png/hdr/vorbis asset loaders
# from the build for faster compiles and a smaller binary on every platform.
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_render",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "tonemapping_luts",
    "x11",
] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"

# `wayland` is additive on top of the default `x11` so the native dev build
# runs on both Xorg and Wayland sessions instead of falling back through
# XWayland.  Cargo unions these features with the base `bevy` dep.
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.14", default-features = false, features = ["wayland"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Strip symbols from release builds — keeps the .wasm (and the native binary)
# from shipping ~hundreds of MB of debug info.  Thin LTO + a single codegen
# unit trade release-build time for a faster, smaller binary.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# ── Web (wasm32-unknown-unknown) ───────────────────────────────────────────
# Browser build.  `webgl2` picks the wgpu GL backend (WebGPU would need a
# separate build and narrower browser support).  The `getrandom`/`uuid` lines
# exist only to flip their JS-randomness features on — `rand`, `ahash` and
# `bevy_asset` pull these crates in transitively and fail to compile for wasm
# without them.  `web-sys` features are the browser APIs the game touches
# directly (localStorage for settings/achievements, `matchMedia` for the
# touch-profile probe; WebRTC bindings are added by the net layer).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.14", default-features = false, features = ["webgl2"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "MediaQueryList",
    # Signaling (net_web.rs)
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "BinaryType",
    # WebRTC data channels (net_web.rs)
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelType",
    "RtcDataChannelEvent",
    "RtcPeerConnectionIceEvent",
    "RtcPeerConnectionState",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
] }
