[package]
name = "signaling"
version = "0.1.0"
edition = "2021"
description = "Room broker for zombiegame2's browser multiplayer: relays WebRTC offers/answers/ICE between a host and its joiners, and serves the static web build."

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.5", features = ["fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
