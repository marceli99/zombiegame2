# `getrandom` 0.3 (pulled in transitively) refuses to build for
# wasm32-unknown-unknown unless the JS backend is selected via a cfg flag —
# the `wasm_js` cargo feature alone is not enough.  Applies only to the web
# target, so native builds are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
